syntax = "proto3";

package shortener_grpc;

option go_package = ".";

message RegRequest {
  string Login = 1;
  string Secret = 2;
}

message RegResponse {
  string Token = 1;
}

message AuthRequest {
  string Login = 1;
  string Secret = 2;
}

message AuthResponse {
  string Token = 1;
}

service Auth {
  rpc Register (RegRequest) returns (RegResponse);
  rpc Auth (AuthRequest) returns (AuthResponse);
}